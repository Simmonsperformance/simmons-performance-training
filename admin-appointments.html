<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointment Admin | Simmons Performance Training</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="order-config.js"></script>
  <style>
    body{margin:0;background:#101010;color:#f5f5f5;font-family:Arial,sans-serif}
    main{max-width:1100px;margin:35px auto;padding:20px}
    h1{color:#e0b326} input,select,textarea,button{font:inherit;padding:11px;margin:5px 0;border-radius:5px}
    input,select,textarea{background:#222;color:white;border:1px solid #555;max-width:100%}
    button{cursor:pointer;border:0;font-weight:bold;background:#e0b326;color:#111}
    button.danger{background:#b83333;color:white}
    .panel,.appointment{background:#1b1b1b;border:1px solid #393939;border-radius:10px;padding:18px;margin:15px 0}
    .appointment h3{margin-top:0}.muted{color:#bbb}.error{color:#ff8585}.success{color:#8ce0a1}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .row>*{flex:1}.hidden{display:none}.details{line-height:1.7;overflow-wrap:anywhere}
    textarea{width:95%;min-height:55px}
  </style>
</head>
<body>
<main>
  <h1>Simmons Performance Training</h1>
  <h2>Appointment Administration</h2>

  <section id="login" class="panel">
    <h3>Administrator sign in</h3>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="signIn">Sign in</button>
    <p id="loginMessage" class="muted"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel row">
      <div>
        <strong>Appointment requests</strong>
        <p class="muted">Approve requests first. Confirm only after payment is verified.</p>
      </div>
      <a href="admin-orders.html" style="display:inline-block;padding:11px;background:#c6a15b;color:#111;text-decoration:none;font-weight:bold;border-radius:5px">Digital Orders</a>
      <button id="refresh">Refresh</button>
      <button id="signOut">Sign out</button>
    </div>
    <p id="message"></p>
    <div id="appointments"></div>
  </section>
</main>

<script>
(() => {
  const config = window.SPT_ORDER_CONFIG;
  const login = document.getElementById("login");
  const dashboard = document.getElementById("dashboard");
  const loginMessage = document.getElementById("loginMessage");
  const message = document.getElementById("message");
  const list = document.getElementById("appointments");
  const requestedBookingId = new URLSearchParams(window.location.search).get("booking");

  if (!config?.supabaseUrl || !config?.publishableKey ||
      !config?.manageAppointmentsUrl) {
    loginMessage.textContent =
      "Configuration missing: check order-config.js for supabaseUrl, publishableKey, and manageAppointmentsUrl.";
    loginMessage.className = "error";
    return;
  }

  const db = window.supabase.createClient(
    config.supabaseUrl,
    config.publishableKey
  );

  function showMessage(text, isError = false) {
    message.textContent = text;
    message.className = isError ? "error" : "success";
  }

  async function callAdmin(payload) {
    const { data: { session } } = await db.auth.getSession();
    if (!session) throw new Error("Please sign in again.");

    const response = await fetch(config.manageAppointmentsUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
       
"Authorization": `Bearer ${session.access_token}`,

        "apikey": config.publishableKey
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || "Request failed.");
    return result;
  }

  function make(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
  }

  function addField(parent, labelText, value) {
    const line = make("div", undefined, "details");
    line.appendChild(make("strong", labelText + ": "));
    line.appendChild(document.createTextNode(
      value === null || value === undefined || value === ""
        ? "—" : String(value)
    ));
    parent.appendChild(line);
  }

  function formatDate(value) {
    if (!value) return "—";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "—" : date.toLocaleString();
  }

  async function act(booking, action, method, notes, button) {
    button.disabled = true;
    try {
      await callAdmin({
        action,
        booking_id: booking.id,
        payment_method: method || null,
        admin_notes: notes || null
      });
      showMessage(action === "verify_payment"
        ? "Appointment and payment confirmed. Check the message below for any email warning."
        : action === "approve" ? "Appointment approved. Payment still needs to be verified." : "Appointment rejected.");
      await loadAppointments();
    } catch (error) {
      showMessage(error.message, true);
      button.disabled = false;
    }
  }

  function renderAppointment(booking) {
    const card = make("article", undefined, "appointment");
    const slot = Array.isArray(booking.booking_slots)
      ? booking.booking_slots[0] : booking.booking_slots;

    card.id = `booking-${booking.id}`;
    card.appendChild(make("h3", booking.athlete_name || "Appointment request"));
    addField(card, "Booking ID", booking.id);
    const serviceLabels = {
      "one-on-one": "1-on-1 Session — $75 / session",
      "group-speed": "Group Speed Training — $55 / athlete",
      "three-times-weekly": "3x Weekly Package — $195 / week",
      "house-call": "House Call Session — $100 / session"
    };
    addField(card, "Service / Price", serviceLabels[booking.service_key] || booking.service_key);
    addField(card, "Date", formatDate(slot?.starts_at));
    addField(card, "End", formatDate(slot?.ends_at));
    addField(card, "Status", booking.status);
    addField(card, "Payment status", booking.payment_status);
    addField(card, "Payment method", booking.payment_method);
    addField(card, "Age", booking.age);
    addField(card, "Sport", booking.sport);
    addField(card, "Position", booking.position);
    addField(card, "Athlete email", booking.athlete_email);
    addField(card, "Guardian", booking.guardian_name);
    addField(card, "Guardian email", booking.guardian_email);
    addField(card, "Guardian phone", booking.guardian_phone);
    addField(card, "Goals", booking.training_goals);
    addField(card, "Additional notes", booking.notes);
    addField(card, "Requested", formatDate(booking.created_at));

    const notes = document.createElement("textarea");
    notes.placeholder = "Private admin notes (optional)";
    notes.value = booking.admin_notes || "";
    card.appendChild(notes);

    const actions = make("div", undefined, "row");

    if (booking.status === "pending") {
      const approve = make("button", "Approve request");
      approve.onclick = () => act(booking, "approve", null, notes.value, approve);
      actions.appendChild(approve);

      const reject = make("button", "Reject request", "danger");
      reject.onclick = () => {
        if (confirm("Reject this appointment request?")) {
          act(booking, "reject", null, notes.value, reject);
        }
      };
      actions.appendChild(reject);
    }

    if (booking.status === "approved") {
      const method = document.createElement("select");
      method.innerHTML =
        '<option value="">Select payment method</option>' +
        '<option value="zelle">Zelle</option>' +
        '<option value="cash_in_person">Cash in person</option>';
      if (booking.payment_method) method.value = booking.payment_method;
      actions.appendChild(method);

      const verify = make("button", "Verify payment & confirm");
      verify.onclick = () => {
        if (!method.value) {
          showMessage("Select Zelle or cash first.", true);
          return;
        }
        if (confirm("Confirm that you personally verified this payment?")) {
          act(booking, "verify_payment", method.value, notes.value, verify);
        }
      };
      actions.appendChild(verify);

      const reject = make("button", "Reject request", "danger");
      reject.onclick = () => {
        if (confirm("Reject this approved appointment?")) {
          act(booking, "reject", null, notes.value, reject);
        }
      };
      actions.appendChild(reject);
    }

    if (actions.children.length) card.appendChild(actions);
    list.appendChild(card);
  }

  async function loadAppointments() {
    list.replaceChildren();
    showMessage("Loading appointments…");

    try {
      const result = await callAdmin({ action: "list" });
      const appointments = result.appointments || [];

      if (!appointments.length) {
        list.appendChild(make("p", "No appointment requests found."));
      } else {
        appointments.forEach(renderAppointment);
      }
      if (requestedBookingId) {
        const requestedCard = document.getElementById(`booking-${requestedBookingId}`);
        if (requestedCard) {
          requestedCard.scrollIntoView({ behavior: "smooth", block: "start" });
          requestedCard.style.borderColor = "#e0b326";
        } else {
          showMessage("The linked appointment wasn't found in the latest 200 requests.", true);
          return;
        }
      }

      showMessage(`Loaded ${appointments.length} appointment(s).`);
    } catch (error) {
      showMessage(error.message, true);
    }
  }

  async function updateSession() {
    const { data: { session } } = await db.auth.getSession();
    login.classList.toggle("hidden", !!session);
    dashboard.classList.toggle("hidden", !session);
    if (session) await loadAppointments();
  }

  document.getElementById("signIn").onclick = async () => {
    loginMessage.textContent = "Signing in…";
    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) {
      loginMessage.textContent = error.message;
      loginMessage.className = "error";
      return;
    }
    await updateSession();
  };

  document.getElementById("refresh").onclick = loadAppointments;
  document.getElementById("signOut").onclick = async () => {
    await db.auth.signOut();
    await updateSession();
  };

  db.auth.onAuthStateChange((_event, session) => {
    login.classList.toggle("hidden", !!session);
    dashboard.classList.toggle("hidden", !session);
  });

  updateSession();
})();
</script>
</body>
</html>
